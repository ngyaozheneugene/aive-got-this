name: CI

# G runs on every commit: pure functions, no model, no gateway.
# A and X call the organiser LLM gateway, so they run nightly and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 02:00 SGT
  workflow_dispatch:

jobs:
  gate:
    name: typecheck, G suite and Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:g
      # The Postgres adapter, held row for row to the in-memory one.
      - run: npm run test:pg
        env:
          DATABASE_URL_TEST: postgres://dispatch:dispatch@localhost:5432/dispatch_test

  agent:
    name: A and X suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
      LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:a
      - run: npm run test:x
