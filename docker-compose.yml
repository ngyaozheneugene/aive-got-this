# Product data on this box. Next.js runs with `npm run dev` locally and in
# Compose on Lightsail. The app applies db/migrations/*.sql itself and seeds an
# empty database, so a schema change is a new migration, not a new volume.
#
# Local dev:  npm run db:up      (postgres + optimizer only; app via npm run dev)
#
# Caddy fronts the app on 80/443. Set SITE_ADDRESS in .env: a hostname on the
# box so Caddy gets a real certificate, ":80" locally for plain HTTP.
# On the box: docker compose up -d --build  (all three; no Node installed there)
services:
  postgres:
    image: postgres:16-alpine
    container_name: aive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run from the app on first use (src/db/postgres/migrate.ts).
      # Read-only here only for inspection.
      - ./db:/sql:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  optimizer:
    build: ./services/optimizer
    container_name: aive-optimizer
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SOLVER_TIMEOUT_SECONDS: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Next.js. Not started by `npm run db:up` — local dev uses `npm run dev`.
  app:
    build: .
    container_name: aive-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Secrets and settings come from .env on the box. Never baked into the image.
    env_file:
      - .env
    environment:
      # Inside the Compose network, `localhost` means *this container*.
      # Services reach each other by service name, so these override .env.
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      OPTIMIZER_URL: http://optimizer:8081
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # TLS terminator. The only service the public internet talks to.
  caddy:
    image: caddy:2-alpine
    container_name: aive-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" keeps local runs on plain HTTP with no certificate request.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-requesting on every
      # restart, which burns Let's Encrypt rate limits fast.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
